name: Bug report
description: Report a reproducible problem in WP Media Categories.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: WP Media Categories version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Affected interface
      options:
        - Media list
        - Media grid
        - Attachment editor
        - Widget or shortcode
        - Developer API
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs and relevant taxonomy details. Never include credentials or private media.
